## Aitch keymap — `modern` profile
##
## GUI conventions: ^S saves, ^F finds, ^C/^X/^V are the clipboard, ^Z/^Y undo
## and redo, ^Q quits. Reachable from the nano profile with M-M, and from here
## back again with the same chord.
##
## Every command bound in keymaps/nano.toml is bound here too — a profile that
## drops one makes it unreachable, and a unit test enforces the parity. The
## non-editor contexts deliberately match nano.toml chord for chord: Enter,
## Escape and the arrow keys mean the same thing in both worlds.

profile = "modern"
description = "GUI conventions for people who did not grow up in a terminal."

# ---------------------------------------------------------------- editor ----

[[binding]]
context = "editor"
chords = ["F1"]
command = "help"
label = "Help"
priority = 200

[[binding]]
context = "editor"
chords = ["^Q"]
command = "quit"
label = "Quit"
priority = 199

