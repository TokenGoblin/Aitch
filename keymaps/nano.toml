[[binding]]
context = "help"
chords = ["^X", "Escape"]
command = "prompt-cancel"
label = "Exit Help"
priority = 100

[[binding]]
context = "help"
chords = ["^W"]
command = "where-is"
label = "Where Is"
priority = 99

[[binding]]
context = "help"
chords = ["Up", "^P"]
command = "move-up"

[[binding]]
context = "help"
chords = ["Down", "^N"]
command = "move-down"

[[binding]]
context = "help"
chords = ["PgUp", "^Y"]
command = "move-page-up"

[[binding]]
context = "help"
chords = ["PgDn", "^V"]
command = "move-page-down"

[[binding]]
