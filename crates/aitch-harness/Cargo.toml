[package]
name = "aitch-harness"
description = "Headless driver for aitch: feed chords, assert on state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distributed as a built binary, not on crates.io: the crates depend on each
# other by path with no version, which crates.io does not accept. Saying so
# lets `cargo deny` treat a wildcard version as the supply-chain hazard it is
# everywhere else.
publish = false

# Deliberately no GUI dependency: the point of this crate is that CI can run it.
[dependencies]
aitch-core = { workspace = true }
