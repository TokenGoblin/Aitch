[package]
name = "aitch"
description = "A GUI text editor with nano's interaction model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distributed as a built binary, not on crates.io: the crates depend on each
# other by path with no version, which crates.io does not accept. Saying so
# lets `cargo deny` treat a wildcard version as the supply-chain hazard it is
# everywhere else.
publish = false
default-run = "aitch"

[dependencies]
aitch-core = { workspace = true }
aitch-ui = { workspace = true }

# Windows only, and only at build time: it writes a .rc naming the icon and
# runs the SDK's resource compiler over it, so Explorer, Alt-Tab and the
# shortcut have something to show. Nothing links against it and nothing of it
# ends up in the binary but the icon itself.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
