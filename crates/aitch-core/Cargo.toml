[package]
name = "aitch-core"
description = "Editor core for aitch. No GUI dependencies, ever."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distributed as a built binary, not on crates.io: the crates depend on each
# other by path with no version, which crates.io does not accept. Saying so
# lets `cargo deny` treat a wildcard version as the supply-chain hazard it is
# everywhere else.
publish = false

# NON-NEGOTIABLE: no winit, no wgpu, no cosmic-text in this file. See CLAUDE.md.
[dependencies]
# All three are named in PLAN.md's stack table for this phase.
# Ripgrep's own search internals, per PLAN.md's stack table: not shelling
# out to the rg binary.
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
tree-sitter = "0.26"

# The grammars PLAN.md Phase 5 asks for. Each is a C parser compiled at build
# time; they are listed apart from the editor's own dependencies because they
# are data more than code, and because the list will grow.
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
# tree-sitter-toml is stuck at 0.20, which predates the version-independent
# LanguageFn export and so cannot be linked against a modern tree-sitter.
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
notify = "8"
nucleo = "0.5"
ropey = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# The benches build ropes and tree-sitter edits directly.
# Measurement only, for the PLAN.md §6 budgets. Not linked into the editor.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "buffer"
harness = false
