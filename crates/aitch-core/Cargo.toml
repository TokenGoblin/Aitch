[package]
name = "aitch-core"
description = "Editor core for aitch. No GUI dependencies, ever."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# NON-NEGOTIABLE: no winit, no wgpu, no cosmic-text in this file. See CLAUDE.md.
[dependencies]
ropey = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Measurement only, for the PLAN.md §6 budgets. Not linked into the editor.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "buffer"
harness = false
