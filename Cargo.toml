[workspace]
resolver = "2"
members = [
    "crates/aitch-core",
    "crates/aitch-ui",
    "crates/aitch-harness",
    "crates/aitch",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/TokenGoblin/Aitch"

[workspace.dependencies]
aitch-core = { path = "crates/aitch-core" }
aitch-ui = { path = "crates/aitch-ui" }

# See PLAN.md §2 for the stack table. No dependency is added without a line there.
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Note: released binaries are built with --remap-path-prefix, because Rust
# otherwise writes the absolute path of every source file into panic messages
# and debug info -- the build machine's home directory and $CARGO_HOME
# included. packaging/windows/build.ps1 sets it and then refuses to package a
# binary that still carries such a path. The profile option that would do it
# here, trim-paths, is not stable in cargo 1.98.
