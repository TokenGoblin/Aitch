[workspace]
resolver = "2"
members = [
    "crates/aitch-core",
    "crates/aitch-ui",
    "crates/aitch-harness",
    "crates/aitch",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/TokenGoblin/Aitch"

[workspace.dependencies]
aitch-core = { path = "crates/aitch-core" }
aitch-ui = { path = "crates/aitch-ui" }

# See PLAN.md §2 for the stack table. No dependency is added without a line there.
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
