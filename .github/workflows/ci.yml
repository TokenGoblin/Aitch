name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # winit and wgpu dlopen their X11 and Wayland libraries at run time, so
      # these are only needed for the pkg-config probes during the build.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev

      # lavapipe, Mesa's software Vulkan device. Without it the runner has no
      # adapter at all and every rendering test skips. Recommends are left in
      # here: the driver is no use without the loader that finds it.
      - name: Install a software GPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo "--- Vulkan ICDs on this runner ---"
          ls -la /usr/share/vulkan/icd.d/ || echo "no ICD directory"
          echo "--- devices the loader enumerates ---"
          # Captured rather than piped: the exit status of a pipeline is the
          # last command's, so a `|| echo` on the end could never fire. And
          # filtering to the Devices section prints nothing when there is no
          # such section — which is precisely the failure worth diagnosing.
          if summary=$(vulkaninfo --summary 2>&1); then
            devices=$(printf '%s\n' "$summary" | sed -n '/Devices:/,$p')
            if [ -n "$devices" ]; then
              printf '%s\n' "$devices" | head -25
            else
              echo "no Devices section — vulkaninfo said:"
              printf '%s\n' "$summary" | head -40
            fi
          else
            echo "vulkaninfo failed:"
            printf '%s\n' "$summary" | head -40
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A rendering test that skips for want of a GPU still reports "ok", and
      # libtest hides the message saying why. This makes a missing adapter a
      # failure, so the render path cannot quietly lose a platform.
      - name: Test
        run: cargo test --workspace
        env:
          AITCH_REQUIRE_GPU: 1

      - name: Build
        run: cargo build --workspace --release

      # Opening a window needs a display and a GPU; CI has neither by default.
      # This checks the binary links and starts. The window itself is a manual
      # check on both platforms until it is worth standing up Xvfb + lavapipe.
      - name: Smoke test the binary
        run: cargo run --release -p aitch -- --version

      # The benches are budgets from PLAN.md §6, not a gate yet: failing on a
      # regression needs a stored baseline. Keep them compiling meanwhile.
      - name: Build benches
        run: cargo bench --workspace --no-run
