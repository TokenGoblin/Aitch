name: Release

# Tag a version to cut a release:
#     git tag v0.1.0 && git push origin v0.1.0
#
# Or run it by hand from the Actions tab to get an installer to test with,
# without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to Cargo.toml)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # The tests are the gate. An installer nobody can trust is worse than
      # no installer, and this is the last point at which that is cheap.
      - name: Test
        run: cargo test --workspace --release

      # The UI extension is a separate package, and wix only reports its
      # absence once it is already building (error WIX0144).
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Work out the version
        id: version
        shell: pwsh
        # Through the environment, not interpolated into the script. The Linux
        # job had the same shape and the same hazard: a tag name may legally
        # contain a quote, which would close the string and run as PowerShell
        # in a job holding `contents: write`.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version -and $env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME -replace '^v', ''
          }
          if (-not $version) {
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -match '(?m)^version\s*=\s*"([^"]+)"') { $version = $Matches[1] }
          }
          if (-not $version) { throw 'Could not work out a version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      # build.ps1 remaps source paths out of the binary and refuses to package
      # one that still carries the build machine's home directory.
      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version ${{ steps.version.outputs.version }}

      # The zip is the artifact with nothing between it and the user, so it is
      # worth proving it actually runs rather than merely that it exists. This
      # unpacks it somewhere else entirely and runs the binary from there.
      - name: Check the portable zip runs
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "target/dist/aitch-$version-x86_64-windows.zip"
          if (-not (Test-Path $zip)) { throw "no zip at $zip" }

          $unpacked = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $exe = Join-Path $unpacked "aitch-$version-x86_64-windows/aitch.exe"

          # Start-Process -Wait, not `& $exe`: aitch is a GUI-subsystem
          # program, and a shell does not wait for one of those. `&` returned
          # immediately, closed the pipe it was reading, and the editor was
          # still on its way to writing the version into it.
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          $run = Start-Process $exe -ArgumentList '--version' -Wait -PassThru `
                                    -NoNewWindow -RedirectStandardOutput $out
          if ($run.ExitCode -ne 0) { throw "--version exited $($run.ExitCode)" }

          $reported = (Get-Content $out -Raw).Trim()
          if ($reported -ne "aitch $version") {
            throw "the zip's binary reports '$reported', not 'aitch $version'"
          }
          Write-Host "Portable zip runs and reports $reported"

      - name: Check the installer opens
        shell: pwsh
        run: |
          $msi = "target/dist/aitch-${{ steps.version.outputs.version }}-x86_64.msi"
          if (-not (Test-Path $msi)) { throw "no installer at $msi" }

          # A readable Property table is the cheapest proof the file is a real
          # MSI rather than something that merely has the extension.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
            'OpenDatabase', 'InvokeMethod', $null, $installer, @((Resolve-Path $msi).Path, 0))
          $view = $db.GetType().InvokeMember(
            'OpenView', 'InvokeMethod', $null, $db,
            @("SELECT Value FROM Property WHERE Property = 'Manufacturer'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $manufacturer = $record.GetType().InvokeMember(
            'StringData', 'GetProperty', $null, $record, @(1))
          if ($manufacturer -ne 'TokenGoblin') {
            throw "Manufacturer is '$manufacturer'"
          }
          Write-Host "MSI is valid, published by $manufacturer"

      - uses: actions/upload-artifact@v4
        with:
          name: aitch-${{ steps.version.outputs.version }}-windows-x86_64
          path: |
            target/dist/*.msi
            target/dist/*.zip
          if-no-files-found: error

  linux-packages:
    name: Linux packages
    # Deliberately not ubuntu-latest. A binary built against an old glibc runs
    # on newer systems and the reverse is not true, and PLAN.md Phase 8 asks
    # for the oldest glibc worth supporting -- a static build is not possible
    # here, since winit, wgpu and cosmic-text all dlopen their graphics
    # libraries and a static musl binary cannot dlopen at all.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Needed only for the pkg-config probes while compiling. winit and wgpu
      # dlopen these at run time rather than linking against them.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev desktop-file-utils

      - name: Test
        run: cargo test --workspace --release

      - name: Work out the version
        id: version
        # Through the environment, never interpolated into the script. A tag
        # name may legally contain a quote and `inputs.version` is whatever
        # somebody typed; either would close the string and run as shell, in a
        # job that holds `contents: write`.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          [ -n "$version" ] || { echo 'could not work out a version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build the packages
        run: ./packaging/linux/build.sh --version ${{ steps.version.outputs.version }}

      # Every artifact is checked by running the binary out of it rather than
      # by looking at the file. Checking that an installer exists is not the
      # same as checking it works, and that lesson cost a release already.
      - name: Check the tarball runs
        run: |
          version='${{ steps.version.outputs.version }}'
          unpacked="$(mktemp -d)"
          tar -xzf "target/dist/aitch-$version-x86_64-linux.tar.gz" -C "$unpacked"
          reported="$("$unpacked/aitch-$version-x86_64-linux/aitch" --version)"
          [ "$reported" = "aitch $version" ] || { echo "tarball says '$reported'"; exit 1; }
          echo "Tarball runs and reports $reported"

      - name: Check the AppImage runs
        run: |
          version='${{ steps.version.outputs.version }}'
          image="target/dist/Aitch-$version-x86_64.AppImage"
          # A runner has no FUSE, so the image cannot mount itself.
          reported="$("$image" --appimage-extract-and-run --version)"
          [ "$reported" = "aitch $version" ] || { echo "AppImage says '$reported'"; exit 1; }
          echo "AppImage runs and reports $reported"

      - name: Check the package installs, runs and removes
        run: |
          version='${{ steps.version.outputs.version }}'
          deb="target/dist/aitch_${version}_amd64.deb"
          dpkg-deb --info "$deb"
          sudo dpkg -i "$deb"
          reported="$(aitch --version)"
          [ "$reported" = "aitch $version" ] || { echo "installed says '$reported'"; exit 1; }
          # An invalid desktop entry means no launcher ever shows it.
          desktop-file-validate /usr/share/applications/aitch.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/aitch.png
          sudo dpkg -r aitch
          test ! -e /usr/bin/aitch
          echo "Installs, runs as $reported, and removes cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: aitch-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    # One job publishes, so there is nothing to race over. Both builders used
    # to call the release action themselves: they created the same release at
    # once, and only one of them had any notes, so the Linux artifacts could
    # land under text describing a Windows-only build. Ordering them with
    # `needs:` fixed that and cost the parallelism -- a release took as long as
    # both builds end to end. This keeps both.
    needs: [windows-installer, linux-packages]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      # Whatever the two builders uploaded, which is exactly what was checked.
      # Nothing is rebuilt here: a release should ship the artifact that
      # passed, not a fresh one that has not.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Work out the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: List what is being published
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Aitch ${{ steps.version.outputs.version }}.

            ### Windows

            **`.msi`** installs per-user into `%LOCALAPPDATA%\Programs\Aitch` —
            no administrator prompt — and puts `aitch` on your PATH.

            **`.zip`** is the same binary with nothing to install: unpack it
            and run `aitch.exe`. It is not on your PATH and there is no Start
            menu entry, and it still keeps its settings in `%APPDATA%\aitch`
            and its sessions and recovery files in `%LOCALAPPDATA%\aitch`, the
            same as the installed copy.

            ### Linux

            **`.AppImage`** is the one to reach for: one file, no install, no
            root. Make it executable and run it.

            **`.deb`** for Debian and Ubuntu, with a desktop entry and icons.
            It asks for a glibc at least as new as the one it was built
            against, and the package says which — so it refuses rather than
            installing and then failing to start.

            **`.tar.gz`** is the same binary with nothing to install.

            Built against an old glibc deliberately, so it runs on more than
            the distribution that built it. The graphics libraries are loaded
            at run time rather than linked against, so the package requires
            none of them.

            New to it? [docs/guide.md](https://github.com/TokenGoblin/Aitch/blob/main/docs/guide.md)
            is the guide.
